plugins {
    id 'com.android.application'
}

android {
    namespace 'com.caidou.poker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.caidou.poker'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // 用自动生成的 debug 密钥签名，便于直接下载安装（侧载）
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
