<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>贪吃蛇</title>
<style>
  :root{--bg1:#0f1729;--bg2:#16233f;--gold:#e6c86e;--text:#eef2ff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 14px}
  h1{font-size:32px;font-weight:800}
  .bar{display:flex;gap:14px;align-items:center;margin:14px 0}
  .score{background:rgba(255,255,255,.08);padding:8px 16px;border-radius:10px;text-align:center;min-width:84px}
  .score b{display:block;font-size:22px;color:var(--gold)}
  .score span{font-size:11px;color:#9fb0d0}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;font-weight:700;
    background:linear-gradient(90deg,var(--gold),#f3e2a8);color:#0f1729}
  canvas{background:#0b1220;border-radius:14px;touch-action:none;max-width:92vw;height:auto;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .hint{margin-top:14px;color:#9fb0d0;font-size:13px;text-align:center;line-height:1.7}
  .overlay{position:fixed;inset:0;background:rgba(8,12,24,.85);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;z-index:10}
  .overlay.show{display:flex}
  .overlay h2{font-size:30px}
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="bar">
    <div class="score"><b id="score">0</b><span>得分</span></div>
    <div class="score"><b id="best">0</b><span>最高</span></div>
    <button id="start">开始 / 重玩</button>
  </div>
  <canvas id="cv" width="400" height="400"></canvas>
  <p class="hint">方向键 / WASD 控制，手机滑动屏幕。<br/>吃绿色豆子变长，撞墙或咬到自己就结束。</p>
  <div class="overlay" id="over"><h2 id="overT">游戏结束</h2><button id="again">再来一局</button></div>
<script>
(function(){
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  const N=20,CELL=cv.width/N;
  let snake,dir,next,food,score,best=+(localStorage.getItem('snakebest')||0),timer,running=false;
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
  bestEl.textContent=best;
  const KEY={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
    w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  function reset(){
    snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir=[1,0];next=[1,0];
    score=0;scoreEl.textContent=0;placeFood();
  }
  function placeFood(){
    while(true){const f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
      if(!snake.some(s=>s.x===f.x&&s.y===f.y)){food=f;break;}}
  }
  function tryDir(k){if(running&&(k[0]===-next[0]&&k[1]===-next[1]))return;next=k;}
  function loop(){
    dir=next;
    const head={x:snake[0].x+dir[0],y:snake[0].y+dir[1]};
    if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y))return gameOver();
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score++;scoreEl.textContent=score;
      if(score>best){best=score;localStorage.setItem('snakebest',best);bestEl.textContent=best;}
      placeFood();
    }else snake.pop();
    draw();
  }
  function draw(){
    ctx.fillStyle='#0b1220';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='rgba(255,255,255,.04)';
    for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,cv.height);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(cv.width,i*CELL);ctx.stroke();}
    ctx.fillStyle='#4ade80';
    rrect(food.x*CELL+CELL*0.15,food.y*CELL+CELL*0.15,CELL*0.7,CELL*0.7);
    snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#e6c86e':'#38bdf8';
      rrect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);});
  }
  function rrect(x,y,w,h){ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x,y,w,h,5);else ctx.rect(x,y,w,h);ctx.fill();}
  function gameOver(){running=false;clearInterval(timer);
    document.getElementById('overT').textContent='得分 '+score;
    document.getElementById('over').classList.add('show');}
  function start(){reset();draw();document.getElementById('over').classList.remove('show');
    if(timer)clearInterval(timer);running=true;timer=setInterval(loop,110);}
  window.addEventListener('keydown',e=>{if(KEY[e.key]){e.preventDefault();tryDir(KEY[e.key]);}});
  let sx,sy;
  cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
    if(Math.abs(dx)>Math.abs(dy))tryDir(dx>0?[1,0]:[-1,0]);else tryDir(dy>0?[0,1]:[0,-1]);});
  document.getElementById('start').onclick=start;
  document.getElementById('again').onclick=start;
  reset();draw();
})();
</script>
</body>
</html>
