<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>2048</title>
<style>
  :root{--bg:#0f1729;--board:#1b2740;--gold:#e6c86e;--text:#eef2ff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#0f1729,#16233f);
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 14px}
  h1{font-size:34px;font-weight:800;letter-spacing:1px}
  .bar{display:flex;gap:14px;align-items:center;margin:14px 0 18px}
  .score{background:rgba(255,255,255,.08);padding:8px 16px;border-radius:10px;text-align:center;min-width:90px}
  .score b{display:block;font-size:22px;color:var(--gold)}
  .score span{font-size:11px;color:#9fb0d0}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;font-weight:700;
    background:linear-gradient(90deg,var(--gold),#f3e2a8);color:#0f1729}
  .board{position:relative;width:min(92vw,360px);height:min(92vw,360px);background:var(--board);
    border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
  .cell{background:rgba(255,255,255,.05);border-radius:8px}
  .tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:8px;
    font-weight:800;transition:all .12s ease;will-change:transform}
  .overlay{position:absolute;inset:0;background:rgba(8,12,24,.82);border-radius:14px;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
  .overlay.show{display:flex}
  .overlay h2{font-size:30px}
  .hint{margin-top:14px;color:#9fb0d0;font-size:13px;text-align:center;line-height:1.7}
</style>
</head>
<body>
  <h1>2048</h1>
  <div class="bar">
    <div class="score"><b id="score">0</b><span>分数</span></div>
    <div class="score"><b id="best">0</b><span>最高</span></div>
    <button id="new">新游戏</button>
  </div>
  <div class="board" id="board">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="overlay" id="over"><h2 id="overT">游戏结束</h2><button id="again">再来一局</button></div>
  </div>
  <p class="hint">方向键 / WASD 移动，手机滑动屏幕。<br/>相同数字相撞合并，目标是 2048！</p>
<script>
(function(){
  const SIZE=4;
  const board=document.getElementById('board');
  const scoreEl=document.getElementById('score');
  const bestEl=document.getElementById('best');
  const overEl=document.getElementById('over');
  const overT=document.getElementById('overT');
  let grid, score, best=+(localStorage.getItem('g2048best')||0);
  bestEl.textContent=best;
  const COLORS={2:'#cdc1b4',4:'#ece0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',
    128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
  const empty=()=>Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  function setup(){grid=empty();score=0;scoreEl.textContent=0;overEl.classList.remove('show');
    addRandom();addRandom();render();}
  function addRandom(){
    const e=[];for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE;j++)if(!grid[i][j])e.push([i,j]);
    if(!e.length)return;const [i,j]=e[Math.floor(Math.random()*e.length)];
    grid[i][j]=Math.random()<0.9?2:4;
  }
  function render(){
    board.querySelectorAll('.tile').forEach(t=>t.remove());
    const rect=board.getBoundingClientRect();
    const pad=10, gap=10, cell=(rect.width-pad*2-gap*(SIZE-1))/SIZE;
    for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE;j++){
      const v=grid[i][j];if(!v)continue;
      const t=document.createElement('div');t.className='tile';t.textContent=v;
      const fs=cell*(v<100?0.42:v<1000?0.34:v<10000?0.28:0.22);
      t.style.fontSize=fs+'px';t.style.width=cell+'px';t.style.height=cell+'px';
      t.style.left=(pad+j*(cell+gap))+'px';t.style.top=(pad+i*(cell+gap))+'px';
      t.style.background=COLORS[v]||'#3c3a32';t.style.color=v<8?'#5b5042':'#fff';
      board.appendChild(t);
    }
  }
  function slideArr(arr){
    let a=arr.filter(x=>x);
    for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1);}}
    while(a.length<SIZE)a.push(0);
    return a;
  }
  function move(dir){
    const before=JSON.stringify(grid);
    if(dir==='left'){for(let i=0;i<SIZE;i++)grid[i]=slideArr(grid[i]);}
    else if(dir==='right'){for(let i=0;i<SIZE;i++)grid[i]=slideArr(grid[i].slice().reverse()).reverse();}
    else if(dir==='up'){for(let j=0;j<SIZE;j++){let col=[];for(let i=0;i<SIZE;i++)col.push(grid[i][j]);col=slideArr(col);for(let i=0;i<SIZE;i++)grid[i][j]=col[i];}}
    else if(dir==='down'){for(let j=0;j<SIZE;j++){let col=[];for(let i=0;i<SIZE;i++)col.push(grid[i][j]);col=slideArr(col.slice().reverse()).reverse();for(let i=0;i<SIZE;i++)grid[i][j]=col[i];}}
    if(JSON.stringify(grid)!==before){
      if(score>best){best=score;localStorage.setItem('g2048best',best);bestEl.textContent=best;}
      scoreEl.textContent=score;addRandom();render();
      if(!movesAvailable()){overT.textContent=has2048()?'你赢了 🎉':'游戏结束';overEl.classList.add('show');}
    }
  }
  function movesAvailable(){
    for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE;j++){
      if(!grid[i][j])return true;
      if(j<SIZE-1&&grid[i][j]===grid[i][j+1])return true;
      if(i<SIZE-1&&grid[i][j]===grid[i+1][j])return true;
    }
    return false;
  }
  function has2048(){return grid.some(r=>r.some(x=>x>=2048));}
  const KEY={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
    a:'left',d:'right',w:'up',s:'down'};
  window.addEventListener('keydown',e=>{if(KEY[e.key]){e.preventDefault();move(KEY[e.key]);}});
  let sx,sy;
  board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  board.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up');});
  document.getElementById('new').onclick=setup;
  document.getElementById('again').onclick=setup;
  setup();
})();
</script>
</body>
</html>
