<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>记忆翻牌</title>
<style>
  :root{--bg1:#0f1729;--bg2:#16233f;--gold:#e6c86e;--text:#eef2ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 14px}
  h1{font-size:32px;font-weight:800}
  .bar{display:flex;gap:14px;align-items:center;margin:14px 0}
  .score{background:rgba(255,255,255,.08);padding:8px 16px;border-radius:10px;text-align:center;min-width:80px}
  .score b{display:block;font-size:22px;color:var(--gold)}.score span{font-size:11px;color:#9fb0d0}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;font-weight:700;
    background:linear-gradient(90deg,var(--gold),#f3e2a8);color:#0f1729}
  .grid{display:grid;grid-template-columns:repeat(4,72px);gap:10px;margin-top:6px}
  .card{width:72px;height:72px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;user-select:none;color:transparent;
    transition:background .2s,transform .12s}
  .card:active{transform:scale(.95)}
  .card.flip{background:linear-gradient(160deg,#1b4d3e,#2a6b54);color:#fff}
  .card.matched{background:linear-gradient(160deg,#1b4d3e,#2a6b54);border-color:#4ade80;color:#fff;opacity:.8}
  .hint{margin-top:16px;color:#9fb0d0;font-size:13px;text-align:center;line-height:1.7}
  .overlay{position:fixed;inset:0;background:rgba(8,12,24,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10}
  .overlay.show{display:flex}.overlay h2{font-size:28px}
</style>
</head>
<body>
  <h1>🧠 记忆翻牌</h1>
  <div class="bar">
    <div class="score"><b id="moves">0</b><span>步数</span></div>
    <div class="score"><b id="pairs">0</b><span>配对</span></div>
    <button id="new">重新开始</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint">点击翻牌，找出两两相同的图案。<br/>翻错会自动盖回，用最少步数通关！</p>
  <div class="overlay" id="over"><h2 id="overT"></h2><button id="again">再玩一次</button></div>
<script>
(function(){
  const EMOJI=['🍎','🍌','🍇','🍉','🍓','🥝','🍒','🍑'];
  const grid=document.getElementById('grid');
  const movesEl=document.getElementById('moves'),pairsEl=document.getElementById('pairs');
  let first=null,lock=false,moves=0,pairs=0;
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function build(){
    first=null;lock=false;moves=0;pairs=0;movesEl.textContent=0;pairsEl.textContent=0;
    document.getElementById('over').classList.remove('show');
    const items=shuffle([...EMOJI,...EMOJI]);
    grid.innerHTML='';
    items.forEach(e=>{
      const c=document.createElement('div');c.className='card';c.dataset.e=e;c.textContent=e;
      c.onclick=()=>flip(c);grid.appendChild(c);
    });
  }
  function flip(c){
    if(lock||c.classList.contains('flip')||c.classList.contains('matched'))return;
    c.classList.add('flip');
    if(!first){first=c;return;}
    moves++;movesEl.textContent=moves;
    if(first.dataset.e===c.dataset.e){
      first.classList.add('matched');c.classList.add('matched');first=null;pairs++;pairsEl.textContent=pairs;
      if(pairs===EMOJI.length){setTimeout(()=>{document.getElementById('overT').textContent='🎉 通关！用了 '+moves+' 步';
        document.getElementById('over').classList.add('show');},350);}
    }else{
      lock=true;const a=first;first=null;
      setTimeout(()=>{a.classList.remove('flip');c.classList.remove('flip');lock=false;},700);
    }
  }
  document.getElementById('new').onclick=build;
  document.getElementById('again').onclick=build;
  build();
})();
</script>
</body>
</html>
